baseURL = 'https://kenan.sh/'
locale = 'en-gb'
title = 'Kenan Jasim'
theme = "typo"

[outputs]
  home = ['html', 'rss']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[taxonomies]
tag = 'tags'

# # Google analytics code
# googleAnalytics = "G-xxxxxxxxx"

[params]
# Meta description
description = "engineer, but make it diabetic. Kenan Jasim writes about code, networks and whatever he's overthinking this week."

# Appearance settings
theme = 'auto'
colorPalette = 'kenan'
hideHeader = false

# Header subtitle (shown under the site title)
headerArabic = 'كنان جاسم'
headerPhonetic = '/kiːˈnæn ˈd͡ʒaːsim/'

# Profile image (asset path — Hugo smart-crops it to a square, face-centred).
profileImage = 'images/selfie.jpg'
# Fun alternate shown when you click the avatar (easter egg). Leave empty to disable.
profileImageAlt = 'images/90s.jpg'

# Little profile card under the homepage picture
profileName = 'Kenan Jasim'
profileRole = 'engineer, but make it diabetic'
# flags are joined with invisible U+2060 word joiners so they stay on one line
profileMeta = 'he/him · 📍 london · 🇬🇧⁠🇱🇧⁠🇮🇶'

# Your Nightscout site URL, e.g. 'https://kenan-cgm.up.railway.app'
# When set, a live blood-sugar reading shows on the About page. Leave empty to hide it.
nightscoutUrl = 'https://nightscout.kenanjasim.com'

# Intro on main page, content is markdown
homeIntroTitle = 'Hello! 👋'
homeIntroContent = """
💚 empathy · nerd · overthinker

This is where I write about whatever I can't stop thinking about: Go, networks, security,
and the odd thing that has nothing to do with computers at all.

More about me [over here](/about). If you're after the grown-up version, [my work lives
on kenanjasim.com](https://kenanjasim.com/). Otherwise, scroll down and have a poke around.
"""

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

# Breadcrumbs
breadcrumbs = true

# Social icons
[[params.social]]
name = "bluesky"
url = "https://bsky.app/profile/kenanjasim.bsky.social"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/kenanjasim/"

[[params.social]]
name = "github"
url = "https://github.com/kenanjasim/"

[[params.social]]
name = "strava"
url = "https://www.strava.com/athletes/97755215"

[[params.social]]
name = "email"
url = "mailto:me@kenan.sh"

[[params.social]]
name = "rss"
url = "/index.xml"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"

[[params.menu]]
name = "travel"
url = "/travel"

# Portfolio / CV lives on its own site
[[params.menu]]
name = "work"
url = "https://kenanjasim.com/"

# Image processing quality (avatars etc.)
[imaging]
quality = 85

# Syntax highlighting on code blocks (class-based, so it adapts to light/dark via chroma.css)
[markup]
[markup.highlight]
noClasses = false
# Allow intentional inline HTML in content (styled spans, wrappers, etc.)
[markup.goldmark.renderer]
unsafe = true

